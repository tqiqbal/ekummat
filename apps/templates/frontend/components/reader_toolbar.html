<div class="reader-toolbar" aria-label="Reading preferences">
  <div class="reader-font-controls"><span class="toolbar-label">TEXT SIZE</span><button class="icon-button text-size-button" type="button" data-font-change="-1" aria-label="Decrease text size">A−</button><span class="font-size-label" data-font-size aria-live="polite">20</span><button class="icon-button text-size-button" type="button" data-font-change="1" aria-label="Increase text size">A+</button></div>
  <div class="reader-actions"><button class="toolbar-button" type="button" data-reading-theme aria-pressed="false">{% include 'frontend/components/icon.html' with name='moon' %}<span>Night reading</span></button>{% if chapter %}<button class="toolbar-button" type="button" data-save-reading data-chapter-title="{{ chapter.name_simple }}" data-chapter-id="{{ chapter.id }}" aria-pressed="false">{% include 'frontend/components/icon.html' with name='bookmark' %}<span data-save-label>Save your place</span></button>{% endif %}</div>
</div>
