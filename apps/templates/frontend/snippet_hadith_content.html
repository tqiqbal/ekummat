<article class="hadith-card" data-hadith aria-label="Hadith {{ entry.sr_no|default:entry.id }}">
  <header class="hadith-card-top"><span class="hadith-id">HADITH {{ entry.sr_no|default:entry.id }}</span><div class="hadith-card-tools"><button type="button" data-copy-hadith aria-label="Copy Hadith and reference" title="Copy Hadith">{% include 'frontend/components/icon.html' with name='copy' %}</button><button type="button" data-share-url="{{ entry.get_absolute_url }}" aria-label="Share Hadith link" title="Share Hadith">{% include 'frontend/components/icon.html' with name='share' %}</button><a href="{{ entry.get_absolute_url }}" aria-label="Open Hadith {{ entry.sr_no|default:entry.id }}" title="Open Hadith"><span aria-hidden="true">↗</span></a></div></header>
  <div class="language-tabs" role="tablist" aria-label="Hadith {{ entry.sr_no|default:entry.id }} language">
    <button class="language-tab" type="button" role="tab" id="tab-roman-{{ entry.id }}" aria-controls="roman-urdu-{{ entry.id }}" aria-selected="true" data-language-tab>Roman Urdu</button>
    <button class="language-tab" type="button" role="tab" id="tab-hindi-{{ entry.id }}" aria-controls="hindi-{{ entry.id }}" aria-selected="false" data-language-tab>Hindi</button>
    <button class="language-tab" type="button" role="tab" id="tab-arabic-{{ entry.id }}" aria-controls="arabic-{{ entry.id }}" aria-selected="false" data-language-tab>Arabic</button>
  </div>
  <section class="language-panel" id="roman-urdu-{{ entry.id }}" role="tabpanel" aria-labelledby="tab-roman-{{ entry.id }}" tabindex="0" data-language-panel><div class="hadith-content" lang="ur-Latn"><p>{{ entry.roman_urdu_content|default_if_none:'' }}</p></div></section>
  <section class="language-panel" id="hindi-{{ entry.id }}" role="tabpanel" aria-labelledby="tab-hindi-{{ entry.id }}" tabindex="0" data-language-panel><div class="hadith-content" lang="hi"><p>{{ entry.hindi_content|default_if_none:'' }}</p></div></section>
  <section class="language-panel" id="arabic-{{ entry.id }}" role="tabpanel" aria-labelledby="tab-arabic-{{ entry.id }}" tabindex="0" data-language-panel><div class="hadith-content" lang="ar" dir="rtl"><p>{{ entry.arabic_content|default_if_none:'' }}</p></div></section>
  <footer class="hadith-reference"><span data-reference><strong>Reference:</strong> {{ entry.reference_field|default_if_none:'' }}</span>{% if entry.grade %}<span class="grade">{{ entry.grade }}</span>{% endif %}</footer>
</article>
